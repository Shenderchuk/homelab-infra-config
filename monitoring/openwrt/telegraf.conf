[agent]
  interval = "10s"
  flush_interval = "10s"
  hostname = "gw02-i7505"

[[outputs.influxdb_v2]]
  urls = ["$INFLUX_URL"]
  token = "$INFLUX_TOKEN"
  organization = "$INFLUX_ORG"
  bucket = "$INFLUX_BUCKET"

[[inputs.cpu]]
  percpu = true
  totalcpu = true
[[inputs.mem]]
[[inputs.system]]
[[inputs.disk]]
[[inputs.net]]
  interfaces = ["eth0", "eth1", "br-lan"]
[[inputs.kernel]]
[[inputs.processes]]
[[inputs.ping]]
  urls = ["192.168.50.4", "85.209.46.1", "1.1.1.1", "8.8.8.8"]
  method = "exec"
  count = 1
  ping_interval = 1.0
  timeout = 2.0

[[inputs.ethtool]]
  interface_include = ["eth0", "eth1"]
